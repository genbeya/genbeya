<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Genbeya</title>
  <!-- The obeya, the project room: docs, history and tasks on its walls, the team on its floor.
       Every edge slopes by 0.42 (about 23°); the gaps between the parts are transparent. -->
  <defs>
    <style>
      .navy { fill: #22313d; stroke: #22313d; stroke-width: 12; stroke-linejoin: round; }
      .accent { fill: #7c7ff2; stroke: #7c7ff2; stroke-width: 12; stroke-linejoin: round; }
      .page { fill: #ffffff; stroke: #ffffff; stroke-width: 8; stroke-linejoin: round; }
      .ink { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Left wall: a wiki page. Drawn upright, then sheared to rise toward the centre. -->
  <g transform="matrix(1 -0.42 0 1 0 149.4)">
    <rect class="navy" x="40" y="0" width="130" height="232" rx="4" />
    <rect class="page" x="58" y="18" width="94" height="196" rx="2" />
    <path class="ink" stroke="#7c7ff2" stroke-width="12" d="M76 54 H120" />
    <path class="ink" stroke="#22313d" stroke-width="8" d="M76 88 H134 M76 112 H134 M76 136 H134 M76 160 H112" />
  </g>

  <!-- Right wall: the task list. -->
  <g transform="matrix(1 0.42 0 1 0 -65.64)">
    <rect class="navy" x="342" y="0" width="130" height="232" rx="4" />
    <rect class="page" x="360" y="18" width="94" height="196" rx="2" />
    <path class="ink" stroke="#22313d" stroke-width="8" d="M374 72 l9 9 l15 -17 M410 76 H438 M374 118 l9 9 l15 -17 M410 122 H438 M410 168 H438" />
    <rect x="376" y="158" width="20" height="20" rx="5" fill="none" stroke="#22313d" stroke-width="6" />
  </g>

  <!-- Back wall: the history, a branch. -->
  <path class="accent" d="M196 64 L256 40 L316 64 L316 299 L256 274 L196 299 Z" />
  <path class="ink" stroke="#ffffff" stroke-width="12" d="M234 98 V226 M234 208 C234 180 280 184 280 150" />
  <circle cx="234" cy="96" r="16" fill="#ffffff" />
  <circle cx="234" cy="230" r="16" fill="#ffffff" />
  <circle cx="280" cy="144" r="16" fill="#ffffff" />

  <!-- Floor: the team. -->
  <path class="accent" d="M256 300 L472 391 L256 482 L40 391 Z" />
  <g fill="#ffffff">
    <circle cx="256" cy="350" r="18" />
    <path d="M220 401 C220 380 235 371 256 371 C277 371 292 380 292 401 Z" />
    <circle cx="188" cy="384" r="16" />
    <path d="M156 429 C156 411 169 402 188 402 C207 402 220 411 220 429 Z" />
    <circle cx="324" cy="384" r="16" />
    <path d="M292 429 C292 411 305 402 324 402 C343 402 356 411 356 429 Z" />
  </g>
</svg>
