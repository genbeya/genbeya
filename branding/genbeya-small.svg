  </g>

  <g transform="matrix(1 0.42 0 1 0 -65.64)">
    <rect class="navy" x="350" y="0" width="134" height="240" rx="4" />
    <rect class="page" x="378" y="28" width="78" height="184" rx="2" />
    <path class="ink" stroke="#22313d" stroke-width="22" d="M402 86 H432 M402 138 H432" />
  </g>

  <path class="accent" d="M196 60 L256 36 L316 60 L316 296 L256 270 L196 296 Z" />
  <path class="ink" stroke="#ffffff" stroke-width="22" d="M234 100 V222 M234 206 C234 176 282 182 282 146" />
