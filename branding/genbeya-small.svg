<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Genbeya</title>
  <!-- The mark for 16 to 48 pixels: the same room with fewer, bolder details and wider gaps. -->
  <defs>
    <style>
      .navy { fill: #22313d; stroke: #22313d; stroke-width: 16; stroke-linejoin: round; }
      .accent { fill: #7c7ff2; stroke: #7c7ff2; stroke-width: 16; stroke-linejoin: round; }
      .page { fill: #ffffff; stroke: #ffffff; stroke-width: 12; stroke-linejoin: round; }
      .ink { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g transform="matrix(1 -0.42 0 1 0 149.4)">
    <rect class="navy" x="28" y="0" width="134" height="240" rx="4" />
