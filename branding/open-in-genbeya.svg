<svg xmlns="http://www.w3.org/2000/svg" width="116" height="20" viewBox="0 0 116 20" role="img" aria-label="Open in Genbeya">
  <title>Open in Genbeya</title>
  <!-- The badge a README links to its repository on genbeya.fyi with. It is one static file for every
       repository: never generate it per repository, which would tell the server who reads which README. -->
  <clipPath id="round"><rect width="116" height="20" rx="3" /></clipPath>
  <g clip-path="url(#round)">
    <rect width="52" height="20" fill="#22313d" />
    <rect x="52" width="64" height="20" fill="#5b5fd6" />
  </g>
  <g fill="#ffffff" text-anchor="middle" font-family="Verdana, Geneva, 'DejaVu Sans', sans-serif" font-size="11">
    <text x="26" y="14">Open in</text>
    <text x="84" y="14">Genbeya</text>
  </g>
</svg>
