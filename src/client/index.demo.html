<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>Genbeya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Try Genbeya in your browser: a wiki, a task board, a code editor and version control for a Git repository."
    />
    <!-- The policy every shell serves (src/shells/content-security-policy.ts); frame-ancestors only works as a header. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <link rel="icon" type="image/png" sizes="48x48" href="icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
  </head>
  <body>
    <gd-root></gd-root>
    <noscript>The Genbeya demo needs JavaScript.</noscript>
  </body>
</html>
