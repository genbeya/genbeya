<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>Genbeya on GitHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Open a GitHub repository's wiki, task board and code in Genbeya, in your browser." />
    <meta name="referrer" content="no-referrer" />
    <!--
      The policy every shell serves (src/shells/content-security-policy.ts), and connections to GitHub's API and
      raw files, which the page reads the repository from; frame-ancestors only works as a header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/png" sizes="48x48" href="icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <style>
      .gh-start {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px 16px;
        background: var(--bg-app);
        color: var(--text);
        font-family: var(--font-ui);
        font-size: 14px;
        line-height: 1.5;
      }
      .gh-card {
        width: min(100%, 520px);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: var(--radius-l);
        background: var(--bg-panel);
        box-shadow: var(--shadow-card);
      }
      .gh-card h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .gh-card h2 {
        margin: 20px 0 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
      }
      .gh-card p,
      .gh-card ul {
        margin: 10px 0 0;
      }
      .gh-card ul {
        padding-left: 18px;
        color: var(--text-2);
      }
      .gh-card li + li {
        margin-top: 6px;
      }
      .gh-card a:not(.btn) {
        color: var(--accent-text);
      }
      .gh-eyebrow {
        margin: 0 0 4px !important;
        color: var(--accent-text);
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .gh-subtitle,
      .gh-hint {
        color: var(--text-3);
      }
      .gh-hint {
        font-size: 12.5px;
      }
      .gh-form {
        margin-top: 18px;
      }
      .gh-form details {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .gh-form summary {
        cursor: pointer;
        color: var(--text-2);
      }
      .gh-form label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 500;
      }
      .gh-form input {
        width: 100%;
        height: 32px;
        padding: 0 9px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        background: var(--bg-input);
        color: var(--text);
        font: inherit;
      }
      .gh-status {
        min-height: 21px;
        color: var(--text-2);
      }
      .gh-error {
        padding: 8px 10px;
        border-radius: var(--radius);
        background: var(--red-soft);
        color: var(--text);
      }
      .gh-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .gh-actions .btn {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <gd-root></gd-root>
    <noscript>Genbeya on GitHub needs JavaScript.</noscript>
  </body>
</html>
