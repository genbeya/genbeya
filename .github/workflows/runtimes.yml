name: Runtime comparison

# Tests GitDesk, packages it with Electron, Tauri and Deno Desktop on every
# platform, reports the sizes in the job summary and uploads every build for
# testing. Experiment branches only.
on:
  push:
    branches: ["experiment/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/shells/tauri/src-tauri

      - run: npm ci

      - uses: ./.github/actions/verify

      # The end-to-end tests have built the client and the Electron shell.
      - name: Electron
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Tauri
        run: npm run package:tauri

      - name: Deno Desktop
        run: npm run package:deno

      - name: Report sizes
        run: node scripts/report-sizes.mjs

      # One artifact per runtime, so testers pick the one they want. Archives keep the executable bits that artifact zips drop.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out/electron out/tauri out/deno
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) \
            ! -name '__uninstaller*' -exec cp {} out/electron/ \;
          find src/shells/tauri/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} out/tauri/ \;
          tar -czf "out/deno/GitDesk-deno-${{ runner.os }}.tar.gz" -C release-deno .

      - uses: actions/upload-artifact@v4
        with:
          name: GitDesk-electron-${{ runner.os }}
          path: out/electron/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: GitDesk-tauri-${{ runner.os }}
          path: out/tauri/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: GitDesk-deno-${{ runner.os }}
          path: out/deno/*
          if-no-files-found: error
