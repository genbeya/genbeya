name: Runtime comparison

# Packages GitDesk with Electron, Tauri and Deno Desktop on every platform,
# reports the sizes in the job summary and uploads the Tauri installers and
# Deno builds for testing. Experiment branches only.
on:
  push:
    branches: ["experiment/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri/src-tauri

      - run: npm ci

      - name: Electron
        run: npm run build && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Tauri
        run: npm run package:tauri

      - name: Deno Desktop
        run: npm run package:deno

      - name: Report sizes
        run: node scripts/report-sizes.mjs

      # Archives keep the executable bits that artifact zips drop.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find desktop/tauri/src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          tar -czf "out/GitDesk-deno-${{ runner.os }}.tar.gz" -C release-deno .

      - uses: actions/upload-artifact@v4
        with:
          name: GitDesk-tauri-deno-${{ runner.os }}
          path: out/*
          if-no-files-found: error
