name: Build

# Tests Genbeya and packages it with Electron, Tauri and Deno Desktop on Windows,
# macOS and Linux. Every run uploads the installers as artifacts; a push to main
# also publishes them all as one GitHub release.
on:
  push:
    branches: [main, "experiment/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/shells/tauri/src-tauri

      - run: npm ci

      # Every build gets its own patch number, so installers upgrade older installs.
      - name: Stamp the version
        run: node scripts/version.mjs stamp ${{ github.run_number }}

      - uses: ./.github/actions/verify

      # The Tauri shell embeds the client, which the end-to-end tests have built.
      - name: Test the Tauri shell
        run: cargo test --manifest-path src/shells/tauri/src-tauri/Cargo.toml

      # The end-to-end tests have built the client and the Electron shell, so the
      # packaging steps skip the `ng build` of the npm package scripts.
      # Electron's targets and architectures are in the `build` section of package.json.
      - name: Package Electron
        run: npx electron-builder --publish never
        env:
          # No signing certificates are configured; build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package Tauri
        run: npx tauri build
        working-directory: src/shells/tauri

      - name: Package Deno Desktop
        run: node scripts/package-deno.mjs

      - name: Collect installers
        run: node scripts/collect-installers.mjs out/installers

      - name: Report sizes
        run: node scripts/report-sizes.mjs out/installers

      - uses: actions/upload-artifact@v4
        with:
          name: Genbeya-electron-${{ matrix.name }}
          path: out/installers/*-electron-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Genbeya-tauri-${{ matrix.name }}
          path: out/installers/*-tauri-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Genbeya-deno-${{ matrix.name }}
          path: out/installers/*-deno-*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: Genbeya-*
          path: out/installers
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/version.mjs stamp "$GITHUB_RUN_NUMBER")
          tag="v$version"
          # A re-run of an old run has the version of its first run, which is published already.
          if gh release view "$tag" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag exists already; this run's version has been published."
            exit 1
          fi
          # Only a version newer than every published one is the latest release.
          # The step runs with pipefail; grep fails when no release matches.
          newest=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//' | sort -V | tail -n 1)
          latest=true
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "$version is older than $newest, which stays the latest release."
            latest=false
          fi
          sed "s/{{version}}/$version/g" .github/release-notes.md > out/release-notes.md
          ls -l out/installers
          gh release create "$tag" out/installers/* \
            --target "$GITHUB_SHA" \
            --title "Genbeya $version" \
            --notes-file out/release-notes.md \
            --generate-notes \
            --latest="$latest"
